{% extends "base.html" %}
{% block body %}
<h1>Account</h1>
<div class="card">Signed in as <b>{{ person.name }}</b> ({{ person.id }}){% if person.admin %} · admin{% endif %}</div>
<h2>Change password</h2>
{% if error %}<p class="negative">{{ error }}</p>{% endif %}
<form method="post" action="/account/password" class="card" style="display:grid; gap:10px">
<input type="password" name="current" placeholder="Current password" autocomplete="current-password" required>
<input type="password" name="new" placeholder="New password (10+ characters)" autocomplete="new-password" minlength="10" required>
<input type="password" name="again" placeholder="New password again" autocomplete="new-password" minlength="10" required>
<button>Change password</button>
<span class="m">Every device, this one included, then signs in again.</span>
</form>
<form method="post" action="/logout"><button>Sign out</button></form>
{% endblock %}
