<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fin News</title>
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1120; color:#e5e7eb;
       font:16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
form { width:min(320px, 90vw); display:grid; gap:12px; }
input, button { font-size:16px; padding:12px; border-radius:10px; border:1px solid #1f2937; }
input { background:#111827; color:#e5e7eb; } button { background:#2563eb; color:#fff; border:0; }
.err { color:#f87171; }
</style></head>
<body><form method="post" action="/login">
<h1 style="margin:0">Fin News</h1>
{% if error %}<div class="err">Wrong name or password.</div>{% endif %}
<input type="text" name="name" placeholder="Name" value="{{ name or '' }}" autocapitalize="none" autocorrect="off" autocomplete="username" required {{ '' if name else 'autofocus' }}>
<input type="password" name="password" placeholder="Password" autocomplete="current-password" {{ 'autofocus' if name else '' }}>
<button>Sign in</button>
</form>
<script>  // signed out: drop the pages this device saved for offline use, so the next person can't open them
if ("caches" in window) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
</script></body></html>
